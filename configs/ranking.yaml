components:
  # RIASEC cosine (m1), signed BM25 (m3) and the signed semantic encoder (m4) rank in parallel,
  # their scores are fused (below), and the dislike stage runs last. If only one component has a
  # usable signal, fusion is skipped and that component's ranking is used.
  # m3 and m4 drop the user's negative clauses from their queries. m4 needs the checkpoint and
  # index in artifacts/ranking/occupation_semantic_v1/ (not in Git).
  # Same as configs/ranking/occupation_semantic_signed_v2_fusion_zscore_bm25_signed_ignore_v3_dislike_title_v3.json.
  # Without BM25 and the dislike stage: configs/ranking/occupation_semantic_fusion_zscore_v1.json.
  # Dot-product control: configs/ranking/baseline_v1.json.
  m1:
    algorithm: cosine_similarity
    variant: baseline_v1
  m3:
    algorithm: bm25_signed
    variant: ignore_negative_v3
  m4:
    algorithm: occupation_dual_encoder_signed
    variant: finetuned_v2

# Per-query z-scored component scores, summed with equal weights. The RRF (k=60) alternative is
# configs/ranking/occupation_semantic_fusion_v1.json (configs/system.rrf.json).
fusion:
  algorithm: zscore_sum
  variant: equal_v1

# Dislike stage, applied to the final ranking after fusion:
# a strongly worded dislike moves title-matched jobs below every other job; a mildly worded one
# lowers their fused score by 1.5 SD. Remove this key to disable it.
post_fusion:
  algorithm: dislike_demotion
  variant: title_v3
